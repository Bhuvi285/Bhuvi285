name: Update GitHub Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # Checkout your profile repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Generate GitHub metrics
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: assets/github-metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          user: Bhuvi285
          template: classic

          base: header, activity, community, repositories, metadata

          config_timezone: Asia/Kolkata

          plugin_languages: yes
          plugin_languages_limit: 8

          plugin_calendar: yes

      # Generate GitHub achievements
      - name: Generate GitHub Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: assets/github-achievements.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          user: Bhuvi285
          template: classic
          base: ""

          config_timezone: Asia/Kolkata

          plugin_achievements: yes
          plugin_achievements_threshold: B

      # Generate contribution snake
      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Bhuvi285
          outputs: |
            assets/github-contribution-grid-snake.svg

      # Commit generated SVG files
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p assets

          git add assets/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub profile assets"
            git push
          fi
